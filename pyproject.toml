[project]
name = "smac-jepa-wm"
version = "0.1.0"
description = "Entity-slot JEPA world model experiments for SMACLite."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "gymnasium>=0.29",
  "pandas>=2.3.3",
  "matplotlib>=3.10.9",
  "wandb>=0.16"
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["smac_jepa*"]
